services:
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp_development
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: build-backend
    container_name: backend
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: myuser
      DATABASE_PASSWORD: mypassword
      DATABASE_NAME: myapp_development
    ports:
      - "3000:3000"
    command: bash -c "cd /app/backend && bundle exec rails server -b 0.0.0.0"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: build-frontend
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:

